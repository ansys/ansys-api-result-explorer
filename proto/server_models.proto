  enum Message_type {
    MESSAGE_TYPE_TOPICS = 0;
  }

  Message_type message_type = 1;

  repeated Topic topics = 2;

}

message WsTopicsRequest {

  enum Request_type {
    REQUEST_TYPE_LIST_TOPICS = 0;
  }

  Request_type request_type = 1;

}

message WsUnsubscribeRequest {

  enum Request_type {
    REQUEST_TYPE_UNSUBSCRIBE = 0;
  }

  Request_type request_type = 1;

  repeated Topic topics = 2;

}

message WsUpdateMessage {

  enum Message_type {
    MESSAGE_TYPE_UPDATE = 0;
  }

  Message_type message_type = 1;

  Topic topic = 2;

  WsUpdateMessageType update_type = 3;

  optional string message = 4;

}

enum WsUpdateMessageType {
  WS_UPDATE_MESSAGE_TYPE_NEW_DATA = 0;
}

