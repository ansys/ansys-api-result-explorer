version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
    cooldown:
      include:
        - '*'
      default-days: 7
    ignore:
      # protobuf is pinned to an exact version by ansys-tools-protoc-helper; let
      # that package drive the protobuf version instead of upgrading it directly.
      - dependency-name: "protobuf"
    groups:
       uv-deps:
          patterns:
            - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      include:
        - '*'
      default-days: 7
    groups:
       actions-deps:
          patterns:
            - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      include:
        - '*'
      default-days: 7
    groups:
       pre-commit-deps:
          patterns:
            - "*"
