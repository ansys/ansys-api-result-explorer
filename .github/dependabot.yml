version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
    cooldown:
      include:
        - '*'
      default-days: 7
    groups:
       uv-deps:
          patterns:
            - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      include:
        - '*'
      default-days: 7
    groups:
       actions-deps:
          patterns:
            - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      include:
        - '*'
      default-days: 7
    groups:
       pre-commit-deps:
          patterns:
            - "*"
