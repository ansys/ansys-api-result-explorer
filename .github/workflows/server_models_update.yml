name: Update server models

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

env:
  MAIN_PYTHON_VERSION: '3.11'

jobs:

  update:
    name: "Update server models"
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          activate-environment: true
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          enable-cache: "false"

      - name: Create data folder
        run: mkdir -p /tmp/data

      - name: Start Result Explorer
        id: rx-compose
        uses: ./.github/actions/result-explorer-docker
        with:
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          ghcr-username: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          ghcr-token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          license-server: ${{ secrets.LICENSE_SERVER }}
          results-folder: /tmp/data

      - name: Generate server models from openapi
        run: |
          python scripts/generate_proto_from_openapi.py

      - name: Pre-commit checks
        continue-on-error: true
        run: |
          uv sync --group build
          pre-commit install
          pre-commit run --files proto/server_models.proto

      - name: "Create PR if changes detected"
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "[Auto] Update server models"
          base: main
          branch: maint/update-server-models
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          delete-branch: true
          body: |
            This PR was automatically generated by a workflow to update the server models.
            Please review the changes and merge if everything looks good.
