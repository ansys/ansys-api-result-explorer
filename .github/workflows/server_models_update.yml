name: Update server models

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

env:
  MAIN_PYTHON_VERSION: '3.11'
  RX_SERVER_INSTALLATION_PATH: '/tmp/result-explorer-server'

jobs:

  update:
    name: "Update server models"
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          activate-environment: true
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          enable-cache: "false"

      - name: Create data folder
        run: mkdir -p /tmp/data

      - name: "Install Result Explorer"
        id: install-rx
        uses: ./.github/actions/result-explorer-server
        with:
          version: 'latest-dev'
          installation-path: ${{ env.RX_SERVER_INSTALLATION_PATH }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - name: Generate server models from openapi
        run: |
          python scripts/generate_proto_from_openapi.py

      - name: Pre-commit checks
        continue-on-error: true
        run: |
          uv sync --group build
          pre-commit install
          pre-commit run --files proto/server_models.proto

      - name: "Create PR if changes detected"
        id: create-pr
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          title: "[Auto] Update server models"
          base: main
          branch: maint/update-server-models
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          delete-branch: true
          body: |
            This PR was automatically generated by a workflow to update the server models.
            Please review the changes and merge if everything looks good.
