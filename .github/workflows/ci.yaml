name: GitHub CI

on:
  pull_request:
  push:
    tags:
      - "*"
    branches:
      - main

env:
  MAIN_PYTHON_VERSION: '3.11'
  PACKAGE_NAME: 'ansys-api-result-explorer'

jobs:
  code-style:
    name: "Code style"
    runs-on: ubuntu-latest
    steps:
      - uses: ansys/actions/code-style@v10.3.1
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  build-library:
    name: "Build library"
    runs-on: ubuntu-latest

    steps:

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          enable-cache: "false"

      - name: Proto compile
        run: |
            uv sync --group build
            uv run proto_compile.py

      - name: Build the library
        run: |
          uv build

      - name: Run tests
        run: |
            uv run pytest -v --junitxml test_results.xml
        working-directory: api/python

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'test*.xml'
          detailed_summary: true
          include_passed: true
          check_name: Python Test report

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: dist/*.whl