name: GitHub CI

on:
  pull_request:
  push:
    tags:
      - "*"
    branches:
      - main
  workflow_dispatch:

env:
  MAIN_PYTHON_VERSION: '3.11'
  PACKAGE_NAME: 'ansys-api-result-explorer'

jobs:

  code-style:
    name: "Code style"
    runs-on: ubuntu-latest
    steps:
      - uses: ansys/actions/code-style@v10.3.5
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  proto-compile:
    name: "Proto compile"
    runs-on: ubuntu-latest

    steps:
     
      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - uses: actions/checkout@v7.0.1
        if: github.event_name != 'pull_request'
        with:
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          activate-environment: true
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          enable-cache: "false"

      - name: Proto compile
        run: |
            uv sync --group build
            uv run scripts/proto_compile.py

      - name: Build the library
        run: |
          uv build

      - name: Run tests
        run: |
            uv run pytest -v --junitxml test_results.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6.4.1
        if: always()
        with:
          report_paths: 'test*.xml'
          detailed_summary: true
          include_passed: true
          check_name: Python Test report

      # Commit changes if on a branch and not a tag
      - name: Commit changes
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags')
        uses: EndBug/add-and-commit@v10
        with:
          add: |
            src/ansys/api/result_explorer/v0
          default_author: github_actions
          message: '[Auto] Update generated code'

  build-library:
    name: "Build library"
    runs-on: ubuntu-latest
    needs: [proto-compile]
    steps:
     
      - name: "Build library source and wheel artifacts"
        uses: ansys/actions/build-library@v10.3.5
        with:
          library-name: ${{ env.PACKAGE_NAME }}


  release:
    name: "Release package"
    runs-on: ubuntu-latest
    needs: [code-style, build-library]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    
    steps:
    #   - name: "Release to the public PyPI repository"
    #     uses: ansys/actions/release-pypi-public@v10
    #     with:
    #       library-name:  ${{ env.PACKAGE_NAME }}
    #       twine-username: "__token__"
    #       twine-token: ${{ secrets.PYPI_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            ./**/*.whl
            ./**/*.tar.gz