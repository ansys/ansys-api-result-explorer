name: GitHub CI

on:
  pull_request:
  push:
    tags:
      - "*"
    branches:
      - main
  workflow_dispatch:

env:
  MAIN_PYTHON_VERSION: '3.11'
  PACKAGE_NAME: 'ansys-api-result-explorer'

jobs:

  code-style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: ansys/actions/code-style@87ff2e65e8884121f9afc97728ca9f213228ecc2 # v11.1.4
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  proto-compile:
    name: Proto compile
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          activate-environment: true
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          enable-cache: "false"

      - name: Proto compile
        run: |
          uv sync --group build
          uv run scripts/proto_compile.py

      - name: Build the library
        run: |
          uv build

      - name: Run tests
        run: |
          uv run pytest -v --junitxml test_results.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@8a133bfa3ecb0ea9024c1e2ae788b4c25f6cdb9d # v6.6.2
        if: always()
        with:
          report_paths: 'test*.xml'
          detailed_summary: true
          include_passed: true
          check_name: Python Test report

      # Commit changes if on a branch and not a tag
      - name: Commit changes
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags')
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          add: |
            src/ansys/api/result_explorer/v0
          default_author: github_actions
          message: '[Auto] Update generated code'

  build-library:
    name: Build library
    runs-on: ubuntu-latest
    needs: [proto-compile]
    steps:

      - name: "Build library source and wheel artifacts"
        uses: ansys/actions/build-library@87ff2e65e8884121f9afc97728ca9f213228ecc2 # v11.1.4
        with:
          library-name: ${{ env.PACKAGE_NAME }}

  release:
    name: Release package to GitHub
    needs: [code-style, build-library]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download the library artifacts from build step
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ansys-api-result-explorer-artifacts
          path: ansys-api-result-explorer-artifacts

      - name: Release to GitHub
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            ./**/*.whl
            ./**/*.tar.gz

  release-pypi:
    name: Release project to PyPI
    needs: [code-style, build-library]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download the library artifacts from build step
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ansys-api-result-explorer-artifacts
          path: ansys-api-result-explorer-artifacts

      - name: Upload artifacts to PyPI using trusted publisher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: "https://upload.pypi.org/legacy/"
          print-hash: true
          packages-dir: ansys-api-result-explorer-artifacts
          skip-existing: false
