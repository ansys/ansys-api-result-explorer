name: GitHub CI

on:
  pull_request:
  push:
    tags:
      - "*"
    branches:
      - main
  workflow_dispatch:

env:
  MAIN_PYTHON_VERSION: '3.11'
  PACKAGE_NAME: 'ansys-api-result-explorer'

jobs:

  code-style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: ansys/actions/code-style@7e7af221736bc4d9fb84a2ab28f99518e9bca84c # v11.0.5
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  proto-compile:
    name: Proto compile
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          activate-environment: true
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          enable-cache: "false"

      - name: Proto compile
        run: |
          uv sync --group build
          uv run scripts/proto_compile.py

      - name: Build the library
        run: |
          uv build

      - name: Run tests
        run: |
          uv run pytest -v --junitxml test_results.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: always()
        with:
          report_paths: 'test*.xml'
          detailed_summary: true
          include_passed: true
          check_name: Python Test report

      # Commit changes if on a branch and not a tag
      - name: Commit changes
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags')
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          add: |
            src/ansys/api/result_explorer/v0
          default_author: github_actions
          message: '[Auto] Update generated code'

  build-library:
    name: Build library
    runs-on: ubuntu-latest
    needs: [proto-compile]
    steps:

      - name: "Build library source and wheel artifacts"
        uses: ansys/actions/build-library@7e7af221736bc4d9fb84a2ab28f99518e9bca84c # v11.0.5
        with:
          library-name: ${{ env.PACKAGE_NAME }}

  release:
    name: Release package to GitHub
    needs: [code-style, build-library]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download the library artifacts from build step
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ansys-api-result-explorer-artifacts
          path: ansys-api-result-explorer-artifacts

      - name: Release to GitHub
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            ./**/*.whl
            ./**/*.tar.gz

  release-pypi:
    name: Release project to PyPI
    needs: [code-style, build-library]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download the library artifacts from build step
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ansys-api-result-explorer-artifacts
          path: ansys-api-result-explorer-artifacts

      - name: Upload artifacts to PyPI using trusted publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: "https://upload.pypi.org/legacy/"
          print-hash: true
          packages-dir: ansys-api-result-explorer-artifacts
          skip-existing: false
