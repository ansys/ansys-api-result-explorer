repos:

- repo: https://github.com/astral-sh/ruff-pre-commit

  # Ruff version.
  rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # frozen: v0.17.5
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
      exclude: ^src/ansys/api/result_explorer/v0/
    # Run the formatter.
    - id: ruff-format
      exclude: ^src/ansys/api/result_explorer/v0/

# Add copyright statement to files
- repo: https://github.com/ansys/pre-commit-hooks
  rev: dbcd0a4ad0060f78ac3c7d53d342f510edc48eab  # frozen: v0.8.1
  hooks:
  - id: add-license-headers
    exclude: ^src/ansys/api/result_explorer/v0/
    args:
    - --start_year=2026
    - --custom_license=Apache-2.0

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
  hooks:
    - id: check-merge-conflict
    - id: debug-statements
    - id: check-yaml
    - id: trailing-whitespace

- repo: https://github.com/tox-dev/pyproject-fmt
  rev: 3c6e76e10abcae02303212289efed3413350769c # frozen: v2.30.6
  hooks:
    - id: pyproject-fmt
      args: [--keep-full-version]

- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df  # frozen: 0.39.0
  hooks:
    - id: check-github-workflows
